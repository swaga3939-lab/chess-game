<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы Онлайн</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    
    <!-- Подключаем Socket.IO для связи с сервером -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
            --accent: var(--tg-theme-button-color, #2481cc);
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        
        #board { width: 95vw; max-width: 400px; touch-action: none; }

        /* Скрываем координаты для чистоты */
        .notation-322f9 { display: none; }

        .square-55d63 { position: relative; cursor: pointer !important; }
        .board-b72b1 .piece-417db { pointer-events: none !important; -webkit-user-drag: none !important; }
        
        .highlight-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32%; height: 32%; border-radius: 50%; background-color: rgba(0, 0, 0, 0.2); pointer-events: none; }
        .highlight-capture::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 85%; border-radius: 50%; border: 8px solid rgba(0, 0, 0, 0.2); box-sizing: border-box; pointer-events: none; }
        .black-3c85d .highlight-dot::after { background-color: rgba(255, 255, 255, 0.3); }
        .black-3c85d .highlight-capture::after { border-color: rgba(255, 255, 255, 0.3); }
        .highlight-selected { background-color: rgba(255, 255, 0, 0.4) !important; }

        #status-panel { margin-top: 15px; padding: 10px 20px; border-radius: 8px; background: var(--secondary-bg); font-weight: bold; text-align: center; min-width: 200px;}
        .check-warning { color: #ff4444; }

        .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button { padding: 12px 20px; border: none; border-radius: 8px; background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 16px;}
        button:active { opacity: 0.8; }
        .btn-green { background-color: #4CAF50; }
        .btn-red { background-color: #f44336; }

        /* Модальное окно */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        #modal h2 { color: white; margin-bottom: 20px; font-size: 28px; text-align: center;}
    </style>
</head>
<body>
    <div id="status-panel">Подключение...</div>
    <div id="board" style="width: 350px"></div>
    
    <div class="controls">
        <button id="create-game-btn" class="btn-green">Создать игру</button>
        <button id="join-game-btn">Присоединиться</button>
        <button id="restart-btn" class="btn-red">Сброс</button>
    </div>

    <div id="modal">
        <h2 id="modal-text">МАТ!</h2>
        <button onclick="closeModal()">Ок</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // АДРЕС ТВОЕГО СЕРВЕРА НА RENDER
        const SERVER_URL = 'https://chess-server-gh0q.onrender.com';
        
        // Подключаемся к серверу
        const socket = io(SERVER_URL);

        var board = null;
        var game = new Chess();
        var selectedSquare = null;
        var currentRoom = null;
        var myColor = null; // 'w' (белые) или 'b' (черные)

        var $status = document.getElementById('status-panel');

        // --- ЛОГИКА ДОСКИ ---
        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight-dot highlight-capture highlight-selected');
        }

        function highlightMoves(source) {
            removeHighlights();
            $('#board .square-' + source).addClass('highlight-selected');
            var moves = game.moves({ square: source, verbose: true });
            for (var i = 0; i < moves.length; i++) {
                var targetSquare = moves[i].to;
                var pieceOnTarget = game.get(targetSquare);
                if (pieceOnTarget) {
                    $('#board .square-' + targetSquare).addClass('highlight-capture');
                } else {
                    $('#board .square-' + targetSquare).addClass('highlight-dot');
                }
            }
        }

        function onSquareClick(square) {
            if (game.game_over()) return;
            
            // Если мы не в комнате, нельзя ходить
            if (!currentRoom) {
                $status.innerText = "Сначала создайте или присоединитесь к игре!";
                return;
            }

            // Если сейчас не наш ход, нельзя ходить
            if (game.turn() !== myColor) {
                $status.innerText = "Сейчас не ваш ход!";
                return;
            }

            if (!selectedSquare) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    highlightMoves(square);
                }
            } else {
                if (selectedSquare === square) {
                    selectedSquare = null;
                    removeHighlights();
                    return;
                }
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) {
                    board.position(game.fen());
                    updateStatus();
                    // Отправляем ход на сервер
                    if (socket.connected) {
                        socket.emit('move', { room: currentRoom, move: { from: selectedSquare, to: square } });
                    }
                    selectedSquare = null;
                    removeHighlights();
                } else {
                    var piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        highlightMoves(square);
                    } else {
                        selectedSquare = null;
                        removeHighlights();
                    }
                }
            }
        }

        function updateStatus() {
            if (game.in_checkmate()) {
                var winner = game.turn() === 'w' ? 'Черные' : 'Белые';
                $status.innerHTML = 'МАТ! Победили ' + winner;
                $status.classList.add('check-warning');
                document.getElementById('modal-text').innerText = 'МАТ! Победили ' + winner;
                document.getElementById('modal').style.display = 'flex';
            } else if (game.in_draw()) {
                $status.innerHTML = 'НИЧЬЯ';
                $status.classList.remove('check-warning');
                document.getElementById('modal-text').innerText = 'НИЧЬЯ';
                document.getElementById('modal').style.display = 'flex';
            } else {
                var turnText = game.turn() === 'w' ? 'Белые' : 'Черные';
                $status.innerHTML = 'Ход: ' + turnText;
                $status.classList.remove('check-warning');
                if (game.in_check()) {
                    $status.innerHTML += ' (ШАХ!)';
                    $status.classList.add('check-warning');
                }
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        board = Chessboard('board', {
            draggable: false,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        $('#board').on('click', '.square-55d63', function(e) {
            e.preventDefault();
            onSquareClick($(this).attr('data-square'));
        });

        // --- КНОПКИ ---
        document.getElementById('create-game-btn').onclick = () => {
            const roomId = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoom = roomId;
            myColor = 'w'; // Создатель всегда играет белыми
            socket.emit('join', { room: roomId });
            $status.innerHTML = `Вы играете <b>Белыми</b>.<br>ID комнаты: <b>${roomId}</b>.<br>Ждем соперника...`;
        };

        document.getElementById('join-game-btn').onclick = () => {
            const roomId = prompt("Введите ID комнаты (4 символа):");
            if (roomId) {
                currentRoom = roomId.toUpperCase();
                myColor = 'b'; // Присоединившийся играет черными
                socket.emit('join', { room: currentRoom });
                $status.innerHTML = `Вы играете <b>Черными</b>.<br>Комната: <b>${currentRoom}</b>`;
            }
        };

        document.getElementById('restart-btn').onclick = () => {
            if(currentRoom) socket.emit('join', { room: currentRoom }); // Перезаход в комнату сбрасывает игру
        };

        // --- СОБЫТИЯ СЕРВЕРА (SOCKET.IO) ---
        socket.on('connect', () => {
            if (!currentRoom) $status.innerText = "Подключено. Создайте игру!";
        });

        socket.on('disconnect', () => {
            $status.innerText = "Связь с сервером потеряна...";
        });

        // Сервер прислал новое состояние доски
        socket.on('board_state', (data) => {
            game.load(data.fen);
            board.position(data.fen);
            selectedSquare = null;
            removeHighlights();
            updateStatus();
        });

        socket.on('game_over', (data) => {
            if (data.result === 'checkmate') {
                document.getElementById('modal-text').innerText = `МАТ! Победили ${data.winner === 'white' ? 'Белые' : 'Черные'}`;
            } else {
                document.getElementById('modal-text').innerText = 'Ничья.';
            }
            document.getElementById('modal').style.display = 'flex';
        });

        socket.on('invalid_move', (data) => {
            alert('Сервер отклонил ход: ' + data.msg);
        });
    </script>
</body>
</html>
