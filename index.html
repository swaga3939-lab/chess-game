<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <style>
        /* Стили оставляем без изменений */
        :root { --bg-color: var(--tg-theme-bg-color, #161512); --text-color: var(--tg-theme-text-color, #ffffff); --panel-bg: var(--tg-theme-secondary-bg-color, #262421); --accent: var(--tg-theme-button-color, #81b64c); }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; height: 100vh; user-select: none; overflow: hidden; padding-top: 10px; }
        .player-bar { width: 95%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin: 5px 0; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 6px; background-color: #444; background-size: cover; }
        .name-box { display: flex; flex-direction: column; }
        .name { font-weight: bold; font-size: 16px; }
        .timer { background: var(--panel-bg); color: #eee; padding: 6px 12px; border-radius: 6px; font-family: monospace; font-size: 18px; font-weight: bold; border: 1px solid #333; }
        .timer.active { background: #fff; color: #000; border-color: #fff; }
        #board-container { position: relative; width: 95vw; max-width: 400px; margin: 10px 0; border-radius: 4px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #board { width: 100%; touch-action: none; }
        .notation-322f9 { display: none; }
        .square-55d63 { position: relative; cursor: pointer !important; }
        .board-b72b1 .piece-417db { pointer-events: none !important; -webkit-user-drag: none !important; }
        .highlight-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32%; height: 32%; border-radius: 50%; background-color: rgba(0, 0, 0, 0.2); pointer-events: none; }
        .highlight-capture::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 85%; border-radius: 50%; border: 8px solid rgba(0, 0, 0, 0.2); box-sizing: border-box; pointer-events: none; }
        .black-3c85d .highlight-dot::after { background-color: rgba(255, 255, 255, 0.3); }
        .black-3c85d .highlight-capture::after { border-color: rgba(255, 255, 255, 0.3); }
        .highlight-selected { background-color: rgba(255, 255, 0, 0.4) !important; }
        #status-bar { width: 95%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-top: 5px; padding: 10px 0; }
        #status-text { font-weight: bold; color: #bbb; }
        .room-badge { background: #444; padding: 4px 10px; border-radius: 6px; color: white; font-family: monospace; font-weight: bold; cursor: pointer; }
        .controls { margin-top: 10px; display: flex; gap: 10px; width: 95%; max-width: 400px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; transition: transform 0.1s; }
        button:active { transform: scale(0.96); opacity: 0.8; }
        .btn-green { background: linear-gradient(180deg, #8ab962 0%, #6a9c44 100%); }
        .btn-blue { background: linear-gradient(180deg, #4b90c2 0%, #3574a0 100%); }
        .btn-red { background: linear-gradient(180deg, #c24b4b 0%, #a03535 100%); flex: 0.5; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: var(--panel-bg); padding: 30px; border-radius: 12px; text-align: center; width: 80%; max-width: 300px; }
    </style>
</head>
<body>
    <div class="player-bar">
        <div class="player-info"><div class="avatar" id="opp-avatar"></div><div class="name-box"><div class="name" id="opp-name">Ожидание...</div></div></div>
        <div class="timer" id="opp-timer">10:00</div>
    </div>
    <div id="board-container"><div id="board"></div></div>
    <div class="player-bar">
        <div class="player-info"><div class="avatar" id="my-avatar"></div><div class="name-box"><div class="name" id="my-name">Вы</div></div></div>
        <div class="timer active" id="my-timer">10:00</div>
    </div>
    <div id="status-bar">
        <div id="status-text">Ожидание...</div>
        <div class="room-badge" id="room-badge" style="display: none;">---</div>
    </div>
    <div class="controls">
        <button id="create-game-btn" class="btn-green">Создать</button>
        <button id="join-game-btn" class="btn-blue">Войти</button>
        <button id="restart-btn" class="btn-red">Сброс</button>
    </div>
    <div id="modal"><div class="modal-card"><h2 id="modal-text">МАТ!</h2><button class="btn-blue" onclick="closeModal()" style="width: 100%;">Ок</button></div></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let myRealName = "Игрок";
        let myUserId = "guest_" + Math.floor(Math.random() * 1000); // Заглушка, если открыто вне ТГ
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            myRealName = tg.initDataUnsafe.user.first_name;
            myUserId = String(tg.initDataUnsafe.user.id); // Уникальный ID
            document.getElementById('my-name').innerText = myRealName;
            document.getElementById('my-avatar').style.backgroundImage = `url('https://api.dicebear.com/7.x/bottts/svg?seed=${myUserId}')`;
        }

        const SERVER_URL = 'https://chess-server-gh0q.onrender.com';
        
        const socket = io(SERVER_URL, {
            transports: ['websocket'],
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: Infinity
        });

        var board = null;
        var game = new Chess();
        var selectedSquare = null;
        var currentRoom = null;
        var myColor = null;
        var $statusText = document.getElementById('status-text');
        var $roomBadge = document.getElementById('room-badge');

        $roomBadge.addEventListener('click', () => {
            if(currentRoom) { navigator.clipboard.writeText(currentRoom); tg.showAlert("ID скопирован!"); }
        });

        function removeHighlights() { $('#board .square-55d63').removeClass('highlight-dot highlight-capture highlight-selected'); }
        
        function highlightMoves(source) {
            removeHighlights();
            $('#board .square-' + source).addClass('highlight-selected');
            var moves = game.moves({ square: source, verbose: true });
            for (var i = 0; i < moves.length; i++) {
                var targetSquare = moves[i].to;
                if (game.get(targetSquare)) $('#board .square-' + targetSquare).addClass('highlight-capture');
                else $('#board .square-' + targetSquare).addClass('highlight-dot');
            }
        }

        function onSquareClick(square) {
            if (game.game_over() || !currentRoom || game.turn() !== myColor) return;
            if (!selectedSquare) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) { selectedSquare = square; highlightMoves(square); }
            } else {
                if (selectedSquare === square) { selectedSquare = null; removeHighlights(); return; }
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) {
                    board.position(game.fen());
                    updateStatus();
                    if (socket.connected) socket.emit('move', { room: currentRoom, move: { from: selectedSquare, to: square } });
                    selectedSquare = null; removeHighlights();
                } else {
                    var piece = game.get(square);
                    if (piece && piece.color === game.turn()) { selectedSquare = square; highlightMoves(square); }
                    else { selectedSquare = null; removeHighlights(); }
                }
            }
        }

        function updateStatus() {
            if (currentRoom) { $roomBadge.style.display = "block"; $roomBadge.innerText = currentRoom; }
            if (game.in_checkmate()) {
                $statusText.innerHTML = 'МАТ! Победа: ' + (game.turn() === 'w' ? 'Черные' : 'Белые');
                $statusText.style.color = '#ff4444';
                document.getElementById('modal-text').innerText = $statusText.innerHTML;
                document.getElementById('modal').style.display = 'flex';
            } else if (game.in_draw()) {
                $statusText.innerHTML = 'НИЧЬЯ'; $statusText.style.color = '#ff4444';
            } else {
                $statusText.innerHTML = 'Ход: ' + (game.turn() === 'w' ? 'Белые' : 'Черные');
                $statusText.style.color = (game.turn() === myColor) ? '#81b64c' : '#bbb';
                if (game.in_check()) { $statusText.innerHTML += ' (ШАХ!)'; $statusText.style.color = '#ff4444'; }
            }
            document.getElementById('my-timer').classList.toggle('active', game.turn() === myColor);
            document.getElementById('opp-timer').classList.toggle('active', game.turn() !== myColor);
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        board = Chessboard('board', { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' });
        $('#board').on('click', '.square-55d63', function(e) { e.preventDefault(); onSquareClick($(this).attr('data-square')); });

        function joinRoom(room, color) {
            currentRoom = room; myColor = color;
            board.orientation(color === 'w' ? 'white' : 'black');
            socket.emit('join', { room: currentRoom, name: myRealName, user_id: myUserId });
            updateStatus();
        }

        document.getElementById('create-game-btn').onclick = () => {
            const roomId = Math.random().toString(36).substring(2, 6).toUpperCase();
            joinRoom(roomId, 'w');
            tg.showAlert(`Вы играете БЕЛЫМИ.\nКод: ${roomId}`);
        };

        document.getElementById('join-game-btn').onclick = () => {
            const roomId = prompt("Введите ID комнаты:");
            if (roomId) joinRoom(roomId.toUpperCase(), 'b');
        };

        document.getElementById('restart-btn').onclick = () => { 
            if(currentRoom) socket.emit('join', { room: currentRoom, name: myRealName, user_id: myUserId }); 
        };

        // АВТО-ПЕРЕПОДКЛЮЧЕНИЕ
        socket.on('connect', () => { 
            console.log("Подключено. Мой Telegram ID:", myUserId); 
            if (currentRoom) {
                // Если мы были в комнате, а связь оборвалась (свернули апп), возвращаемся обратно!
                console.log("Восстанавливаю сессию в комнате:", currentRoom);
                socket.emit('join', { room: currentRoom, name: myRealName, user_id: myUserId });
            } else {
                $statusText.innerText = "Создайте игру!";
            }
        });
        
        // Telegram событие "приложение снова активно"
        tg.onEvent('activated', () => {
             if (currentRoom && !socket.connected) {
                 console.log("Приложение восстановлено, переподключаемся...");
                 socket.connect();
             }
        });
        
        socket.on('players_update', (data) => {
            const userIds = Object.keys(data);
            if (userIds.length >= 2) {
                const oppId = userIds.find(id => id !== myUserId);
                if (oppId) {
                    const oppName = data[oppId];
                    document.getElementById('opp-name').innerText = oppName;
                    document.getElementById('opp-avatar').style.backgroundImage = `url('https://api.dicebear.com/7.x/bottts/svg?seed=${oppId}')`;
                }
            } else {
                document.getElementById('opp-name').innerText = "Ожидание...";
            }
        });

        socket.on('board_state', (data) => {
            game.load(data.fen);
            board.position(data.fen);
            selectedSquare = null; removeHighlights(); updateStatus();
        });

        socket.on('game_over', (data) => {
            document.getElementById('modal-text').innerText = data.result === 'checkmate' ? `МАТ! Победили ${data.winner === 'white' ? 'Белые' : 'Черные'}` : 'Ничья.';
            document.getElementById('modal').style.display = 'flex';
        });
        
        socket.on('invalid_move', (data) => { tg.showAlert('Сервер отклонил ход: ' + data.msg); });
    </script>
</body>
</html>
