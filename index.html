<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    
    <style>
        body { 
            background-color: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #000000); 
            font-family: sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            margin: 0;
            height: 100vh;
            user-select: none; /* Запрещаем выделять текст */
            -webkit-user-select: none;
        }
        
        #board { 
            width: 95vw; 
            max-width: 400px; 
            margin: 0 auto; 
            touch-action: none; /* Запрещаем скролл при касании доски */
        }

        /* --- МАГИЯ, КОТОРАЯ ЗАПРЕЩАЕТ ТАСКАТЬ ФИГУРЫ --- */
        /* Отключаем реакцию на клики и перетаскивания для самих картинок фигур */
        .board-b72b1 .piece-417db {
            pointer-events: none !important; 
            -webkit-user-drag: none !important;
            user-drag: none !important;
        }

        .square-55d63 {
            position: relative;
            cursor: pointer !important;
        }

        /* 1. Точка для пустой клетки */
        .highlight-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }

        /* 2. Кольцо для съедобной фигуры */
        .highlight-capture::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            border-radius: 50%;
            border: 6px solid rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            pointer-events: none;
        }

        /* Подсветка самой выбранной фигуры (желтый фон) */
        .highlight-selected {
            background-color: rgba(255, 255, 0, 0.4) !important;
        }

        .black-3c85d .highlight-dot::after { background-color: rgba(255, 255, 255, 0.25); }
        .black-3c85d .highlight-capture::after { border-color: rgba(255, 255, 255, 0.25); }

        #status-panel {
            margin-top: 20px;
            padding: 15px 30px;
            border-radius: 10px;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
        }

        .check-warning { color: #ff4444; }

        #restart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="status-panel">Ход белых</div>
    <div id="board" style="width: 350px"></div>
    <button id="restart-btn">🔄 Начать заново</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        var board = null;
        var game = new Chess();
        var $status = document.getElementById('status-panel');
        var selectedSquare = null;

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight-dot highlight-capture highlight-selected');
        }

        function highlightMoves(source) {
            removeHighlights();
            $('#board .square-' + source).addClass('highlight-selected');
            
            var moves = game.moves({ square: source, verbose: true });
            for (var i = 0; i < moves.length; i++) {
                var targetSquare = moves[i].to;
                var pieceOnTarget = game.get(targetSquare);
                
                if (pieceOnTarget) {
                    $('#board .square-' + targetSquare).addClass('highlight-capture');
                } else {
                    $('#board .square-' + targetSquare).addClass('highlight-dot');
                }
            }
        }

        function onSquareClick(square) {
            if (game.game_over()) return;

            // Если ничего не выбрано - выбираем фигуру
            if (!selectedSquare) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    highlightMoves(square);
                }
            } 
            // Если фигура уже выбрана
            else {
                // Отмена выбора при клике на ту же клетку
                if (selectedSquare === square) {
                    selectedSquare = null;
                    removeHighlights();
                    return;
                }

                // Пробуем сделать ход
                var move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move) {
                    board.position(game.fen());
                    updateStatus();
                    selectedSquare = null;
                    removeHighlights();
                } else {
                    // Если ход невозможен, проверяем: может, нажали на другую свою фигуру?
                    var piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        highlightMoves(square);
                    } else {
                        selectedSquare = null;
                        removeHighlights();
                    }
                }
            }
        }

        function updateStatus () {
            var moveColor = 'Белых';
            if (game.turn() === 'b') { moveColor = 'Черных'; }

            if (game.in_checkmate()) {
                $status.innerHTML = 'МАТ! Победа ' + (moveColor === 'Белых' ? 'Черных' : 'Белых');
                $status.classList.add('check-warning');
            } else if (game.in_draw()) {
                $status.innerHTML = 'НИЧЬЯ';
                $status.classList.remove('check-warning');
            } else {
                $status.innerHTML = 'Ход: ' + moveColor;
                $status.classList.remove('check-warning');
                if (game.in_check()) {
                    $status.innerHTML += ' (ШАХ!)';
                    $status.classList.add('check-warning');
                }
            }
        }

        // Инициализация доски БЕЗ перетаскивания
        var config = {
            draggable: false, 
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        }
        board = Chessboard('board', config);

        // Обработка кликов
        $('#board').on('click', '.square-55d63', function(e) {
            e.preventDefault(); // Предотвращаем стандартное поведение браузера
            var square = $(this).attr('data-square');
            onSquareClick(square);
        });

        document.getElementById('restart-btn').addEventListener('click', function() {
            game.reset();
            board.start();
            selectedSquare = null;
            removeHighlights();
            $status.classList.remove('check-warning');
            $status.innerHTML = 'Ход: Белых';
        });

        updateStatus();
    </script>
</body>
</html>
