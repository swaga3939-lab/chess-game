<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    
    <style>
        body { 
            background-color: var(--tg-theme-bg-color, #ffffff); 
            color: var(--tg-theme-text-color, #000000); 
            font-family: sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            margin: 0;
            height: 100vh;
        }
        
        #board { 
            width: 95vw; 
            max-width: 400px; 
            margin: 0 auto; 
        }

        /* ОБЯЗАТЕЛЬНО: Чтобы точки позиционировались ровно по центру */
        .square-55d63 {
            position: relative;
        }

        /* --- СТИЛЬ CHESS.COM --- */
        
        /* 1. Точка для пустой клетки */
        .highlight-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.15); /* Серый полупрозрачный */
            pointer-events: none;
        }

        /* 2. Кольцо для съедобной фигуры */
        .highlight-capture::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            border-radius: 50%;
            border: 6px solid rgba(0, 0, 0, 0.15); /* Толстое серое кольцо */
            box-sizing: border-box;
            pointer-events: none;
        }

        /* Делаем точки светлее на черных клетках */
        .black-3c85d .highlight-dot::after { background-color: rgba(255, 255, 255, 0.25); }
        .black-3c85d .highlight-capture::after { border-color: rgba(255, 255, 255, 0.25); }

        /* --- КОНЕЦ СТИЛЯ --- */

        #status-panel {
            margin-top: 20px;
            padding: 15px 30px;
            border-radius: 10px;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
        }

        .check-warning { color: #ff4444; }

        #restart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="status-panel">Ход белых</div>
    <div id="board" style="width: 350px"></div>
    <button id="restart-btn">🔄 Начать заново</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        var board = null;
        var game = new Chess();
        var $status = document.getElementById('status-panel');

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight-dot highlight-capture');
        }

        function highlightMoves(source) {
            removeHighlights();
            // Получаем список возможных ходов для выбранной фигуры
            var moves = game.moves({ square: source, verbose: true });
            
            for (var i = 0; i < moves.length; i++) {
                var targetSquare = moves[i].to;
                // Проверяем, стоит ли на целевой клетке фигура
                var pieceOnTarget = game.get(targetSquare);
                
                if (pieceOnTarget) {
                    // Если там фигура соперника (или своя, но туда нельзя) - рисуем кольцо
                    $('#board .square-' + targetSquare).addClass('highlight-capture');
                } else {
                    // Если клетка пустая - рисуем точку
                    $('#board .square-' + targetSquare).addClass('highlight-dot');
                }
            }
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
            highlightMoves(source);
        }

        function onDrop (source, target) {
            removeHighlights();
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });
            if (move === null) return 'snapback';
            updateStatus();
        }

        // Важно: если пользователь отпустил фигуру ВНЕ доски, подсветку надо убрать
        function onMouseoutSquare(square, piece) {
            if (piece) removeHighlights();
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            var moveColor = 'Белых';
            if (game.turn() === 'b') { moveColor = 'Черных'; }

            if (game.in_checkmate()) {
                $status.innerHTML = 'МАТ! Победа ' + (moveColor === 'Белых' ? 'Черных' : 'Белых');
                $status.classList.add('check-warning');
            } else if (game.in_draw()) {
                $status.innerHTML = 'НИЧЬЯ';
                $status.classList.remove('check-warning');
            } else {
                $status.innerHTML = 'Ход: ' + moveColor;
                $status.classList.remove('check-warning');
                if (game.in_check()) {
                    $status.innerHTML += ' (ШАХ!)';
                    $status.classList.add('check-warning');
                }
            }
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            onMouseoutSquare: onMouseoutSquare,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        }
        board = Chessboard('board', config);

        document.getElementById('restart-btn').addEventListener('click', function() {
            game.reset();
            board.start();
            $status.classList.remove('check-warning');
            $status.innerHTML = 'Ход: Белых';
        });

        updateStatus();
    </script>
</body>
</html>
