<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <style>
        body { background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); text-align: center; font-family: sans-serif; padding-top: 20px; }
        #board { width: 90vw; max-width: 400px; margin: 0 auto; }
    </style>
</head>
<body>
    <h3>Играйте в шахматы!</h3>
    <div id="board" style="width: 350px"></div>
    <p id="status">Ход белых</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        var board = null;
        var game = new Chess();

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });
            if (move === null) return 'snapback';
            updateStatus();
        }

        function updateStatus () {
            var status = '';
            var moveColor = 'Белые';
            if (game.turn() === 'b') { moveColor = 'Черные'; }

            if (game.in_checkmate()) {
                status = 'Мат! Победа ' + (moveColor === 'Белые' ? 'Черных' : 'Белых');
            } else if (game.in_draw()) {
                status = 'Ничья';
            } else {
                status = 'Ход: ' + moveColor;
                if (game.in_check()) { status += ' (Шах!)'; }
            }
            document.getElementById('status').innerHTML = status;
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        }
        board = Chessboard('board', config);
        updateStatus();
    </script>
</body>
</html>
