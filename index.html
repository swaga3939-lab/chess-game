<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LoChess</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <style>
        :root { 
            --bg-gradient: radial-gradient(circle at top, #2a2a2a 0%, #121212 100%); 
            --panel-bg: rgba(255, 255, 255, 0.06); 
            --panel-border: rgba(255, 255, 255, 0.12); 
            --accent-green: #81b64c; 
            --accent-blue: #42a5f5; 
            --input-bg: rgba(0, 0, 0, 0.4);
        }
        
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: var(--bg-gradient); color: #f0f0f0; 
            display: flex; flex-direction: column; align-items: center; 
            margin: 0; min-height: 100vh; padding-bottom: 20px; overflow-x: hidden; 
        }
        
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 350px; }
        .toast { background: rgba(40, 40, 40, 0.95); backdrop-filter: blur(10px); color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; text-align: center; border: 1px solid #444; box-shadow: 0 5px 15px rgba(0,0,0,0.5); opacity: 0; transform: translateY(-20px); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { border-color: #ef5350; background: rgba(60, 20, 20, 0.95); }

        #lobby { display: flex; flex-direction: column; width: 92%; max-width: 400px; padding: 25px; background: var(--panel-bg); backdrop-filter: blur(15px); border-radius: 20px; margin-top: 30px; border: 1px solid var(--panel-border); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        #lobby h2 { margin-top: 0; margin-bottom: 15px; font-size: 16px; font-weight: 600; color: #ddd; letter-spacing: 0.5px; }
        
        .time-options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .time-btn { padding: 12px 5px; border-radius: 12px; border: 1px solid var(--panel-border); background: rgba(0,0,0,0.2); color: #ccc; cursor: pointer; font-weight: 500; font-size: 14px; transition: all 0.2s; }
        .time-btn.active { background: var(--accent-green); border-color: var(--accent-green); color: white; box-shadow: 0 4px 12px rgba(129, 182, 76, 0.3); transform: translateY(-1px); }
        
        .join-input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--panel-border); background: var(--input-bg); color: white; font-size: 16px; text-align: center; text-transform: uppercase; margin-bottom: 12px; transition: border 0.2s; outline: none; font-weight: bold; letter-spacing: 2px; }
        .join-input:focus { border-color: var(--accent-green); }

        button { padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; color: white; width: 100%; margin-bottom: 12px; transition: all 0.2s; }
        button:active { transform: scale(0.97); }
        
        .btn-green { background: linear-gradient(135deg, #7cb342 0%, #558b2f 100%); box-shadow: 0 4px 15px rgba(85, 139, 47, 0.4); }
        .btn-blue { background: linear-gradient(135deg, #42a5f5 0%, #1565c0 100%); box-shadow: 0 4px 15px rgba(21, 101, 192, 0.4); }
        .btn-red { background: linear-gradient(135deg, #ef5350 0%, #c62828 100%); }
        .btn-purple { background: linear-gradient(135deg, #ab47bc 0%, #8e24aa 100%); }
        .btn-orange { background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); }
        .btn-admin { background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%); border: 1px solid #ff4081; box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4); }
        .btn-admin:disabled { opacity: 0.6; cursor: not-allowed; filter: grayscale(1); transform: none; }

        #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        
        .player-bar { width: 92%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin: 8px 0; padding: 10px 15px; background: var(--panel-bg); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid var(--panel-border); }
        .player-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 12px; background-color: #333; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,0.1); }
        .name-box { display: flex; flex-direction: column; }
        .name { font-weight: 600; font-size: 15px; }
        .rating { font-size: 12px; color: var(--accent-green); font-weight: bold; }
        
        .timer { font-size: 22px; font-weight: bold; font-family: 'Courier New', monospace; padding: 6px 14px; background: rgba(0,0,0,0.6); border-radius: 8px; color: #888; transition: all 0.3s; border: 1px solid transparent; }
        .timer.active { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.3); }
        
        #board-container { position: relative; width: 92vw; max-width: 400px; margin: 10px 0; border-radius: 12px; overflow: hidden; background-color: #f0d9b5; aspect-ratio: 1 / 1; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        #board { width: 100%; height: 100%; touch-action: none; }
        .notation-322f9 { display: none; }
        
        .square-55d63 { position: relative; cursor: pointer !important; }
        .board-b72b1 .piece-417db { pointer-events: none !important; filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.4)); }
        
        .highlight-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30%; height: 30%; border-radius: 50%; background-color: rgba(0, 0, 0, 0.25); }
        .highlight-capture::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 85%; border-radius: 50%; border: 8px solid rgba(0, 0, 0, 0.25); box-sizing: border-box; }
        .highlight-selected { background-color: rgba(255, 215, 0, 0.5) !important; }
        
        .highlight-premove-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30%; height: 30%; border-radius: 50%; background-color: rgba(156, 39, 176, 0.8); }
        .highlight-premove-capture::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 85%; border-radius: 50%; border: 8px solid rgba(156, 39, 176, 0.8); box-sizing: border-box; }
        .highlight-premove-selected { background-color: rgba(156, 39, 176, 0.5) !important; }

        #status-bar { width: 92%; max-width: 400px; display: flex; justify-content: space-between; padding: 12px 15px; margin-top: 5px; background: var(--panel-bg); border-radius: 12px; border: 1px solid var(--panel-border); font-weight: 500; font-size: 14px; }
        .room-badge { background: rgba(129, 182, 76, 0.15); color: var(--accent-green); padding: 4px 12px; border-radius: 6px; font-family: monospace; font-weight: bold; cursor: pointer; border: 1px solid rgba(129, 182, 76, 0.3); }
        
        #chat-container { width: 92%; max-width: 400px; height: 160px; background: var(--panel-bg); backdrop-filter: blur(10px); border-radius: 15px; margin-top: 10px; display: flex; flex-direction: column; border: 1px solid var(--panel-border); overflow: hidden; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { padding: 6px 12px; border-radius: 12px; max-width: 85%; word-wrap: break-word; font-size: 13px; line-height: 1.4; }
        .chat-msg.my { background: rgba(129, 182, 76, 0.25); align-self: flex-end; border-bottom-right-radius: 2px; color: #e0f2c0; }
        .chat-msg.opp { background: rgba(255, 255, 255, 0.1); align-self: flex-start; border-bottom-left-radius: 2px; }
        #chat-input-area { display: flex; padding: 8px; border-top: 1px solid var(--panel-border); background: rgba(0,0,0,0.3); align-items: center; gap: 8px;}
        #chat-input { flex: 1; background: var(--input-bg); border: 1px solid #333; color: white; padding: 10px 15px; border-radius: 20px; font-size: 14px; outline: none; transition: border 0.2s;}
        #chat-input:focus { border-color: var(--accent-green); }
        #chat-send { background: var(--accent-green); border: none; color: white; padding: 0; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; margin: 0;}

        #premove-controls { display: none; width: 92%; max-width: 400px; gap: 10px; margin-top: 10px; }
        #sys-controls { display: none; width: 92%; max-width: 400px; margin-top: 10px; }

        #analysis-panel { display: none; width: 92%; max-width: 400px; background: var(--panel-bg); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--panel-border); text-align: center; }
        .eval-bar-container { width: 100%; height: 16px; background: #222; border-radius: 8px; overflow: hidden; margin-bottom: 8px; border: 1px solid #333; }
        .eval-bar-fill { height: 100%; background: #fff; width: 50%; transition: width 0.3s; }
        .eval-text { font-weight: bold; font-size: 15px; }
        .best-move-text { font-size: 13px; color: var(--accent-green); margin-top: 5px; font-weight: 500;}
        #move-quality { font-size: 16px; font-weight: bold; margin-top: 8px; display: flex; justify-content: center; gap: 8px; }
        .quality-badge { padding: 4px 10px; border-radius: 6px; font-size: 13px; }
        .q-blunder { background: #ff4444; color: white;} .q-mistake { background: #ff9800; color: white;} .q-inaccuracy { background: #ffeb3b; color: black;} .q-good { background: #81b64c; color: white;} .q-best { background: #2196f3; color: white;}

        #move-log { width: 92%; max-width: 400px; height: 80px; overflow-y: auto; background: var(--panel-bg); border-radius: 12px; padding: 12px; font-family: 'Courier New', monospace; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 20px; border: 1px solid var(--panel-border); margin-top: 10px;}
        .move-item { display: flex; gap: 6px; width: 45%; }
        .move-num { color: #666; font-weight: bold;}

        #replay-controls { display: none; width: 92%; max-width: 400px; justify-content: space-between; gap: 10px; margin-top: 10px; }
        .replay-btn { background: #333; padding: 12px; border-radius: 10px; font-size: 18px; width: 48%; border: 1px solid #444;}

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-card { background: #222; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 320px; border: 1px solid #444; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.9); transition: transform 0.3s; }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-card h2 { margin-top: 0; margin-bottom: 20px; font-size: 22px; font-weight: bold; }
        
        #leaderboard-list { text-align: left; margin-bottom: 20px; max-height: 250px; overflow-y: auto; padding-right: 5px;}
        .lb-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; font-size: 15px;}
        .lb-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="lobby">
        <h2>Создать игру</h2>
        <div class="time-options">
            <button class="time-btn" data-time="60">Пуля (1м)</button>
            <button class="time-btn" data-time="180">Блиц (3м)</button>
            <button class="time-btn active" data-time="600">Рапид (10м)</button>
        </div>
        <button id="create-game-btn" class="btn-green">Создать</button>
        
        <h2 style="margin-top: 25px;">Войти по коду</h2>
        <input type="text" id="join-code-input" class="join-input" placeholder="КОД" maxlength="4">
        <button id="join-game-btn" class="btn-blue">Присоединиться</button>
        
        <h2 style="margin-top: 25px;">Смотреть и анализировать</h2>
        <input type="text" id="watch-code-input" class="join-input" placeholder="КОД ПАРТИИ" maxlength="4">
        <button id="watch-game-btn" style="background: #444;">Смотреть партию</button>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="leaderboard-btn" class="btn-blue" style="flex: 1; margin-bottom: 0;">Топ</button>
            <button id="settings-btn" class="btn-purple" style="flex: 1; margin-bottom: 0;">Настройки</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="player-bar">
            <div class="player-info">
                <div class="avatar" id="opp-avatar"></div>
                <div class="name-box">
                    <div class="name" id="opp-name">Ожидание...</div>
                    <div class="rating" id="opp-rating">1200</div>
                </div>
            </div>
            <div class="timer" id="opp-timer">--:--</div>
        </div>

        <div id="board-container"><div id="board"></div></div>

        <div class="player-bar">
            <div class="player-info">
                <div class="avatar" id="my-avatar"></div>
                <div class="name-box">
                    <div class="name" id="my-name">Вы</div>
                    <div class="rating" id="my-rating">1200</div>
                </div>
            </div>
            <div class="timer" id="my-timer">--:--</div>
        </div>

        <div id="status-bar">
            <div id="status-text">...</div>
            <div class="room-badge" id="room-badge">----</div>
        </div>

        <div id="chat-container" style="display: none;">
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Сообщение...">
                <button id="chat-send">></button>
            </div>
        </div>

        <div id="premove-controls">
            <button id="premove-btn" class="btn-purple">Включить премув</button>
            <button id="cancel-premove-btn" class="btn-orange" style="display: none;">Отменить</button>
        </div>

        <div id="sys-controls">
            <button id="engine-hint-btn" class="btn-admin">Анализ позиции</button>
        </div>

        <div id="analysis-panel">
            <div class="eval-bar-container"><div class="eval-bar-fill" id="eval-fill"></div></div>
            <div class="eval-text" id="eval-text">Оценка: 0.00</div>
            <div id="move-quality"></div>
            <div class="best-move-text" id="best-move-text">Лучший ход: ...</div>
        </div>

        <div id="replay-controls">
            <button class="replay-btn" onclick="replayStep(-1)">< Назад</button>
            <button class="replay-btn" onclick="replayStep(1)">Вперед ></button>
        </div>

        <div id="move-log"></div>
    </div>

    <div id="modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modal-text"></h2>
            <button class="btn-blue" onclick="location.reload()">В лобби</button>
        </div>
    </div>
    
    <div id="invite-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 style="margin-bottom: 10px;">Приглашение</h2>
            <img id="invite-avatar" src="" style="width:70px; height:70px; border-radius:50%; margin-bottom:15px; background:#333; border: 2px solid #555;">
            <p style="font-size: 16px; margin-bottom: 5px;"><b id="invite-name"></b></p>
            <p style="color:#aaa; font-size: 14px; margin-bottom: 20px;">приглашает вас на партию.<br><span id="invite-time"></span></p>
            <button id="accept-invite-btn" class="btn-green">Принять</button>
            <button class="btn-red" onclick="closeModal('invite-modal')">Отмена</button>
        </div>
    </div>

    <div id="leaderboard-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>Лидерборд</h2>
            <div id="leaderboard-list"></div>
            <button class="btn-blue" onclick="closeModal('leaderboard-modal')" style="margin-top: 20px;">Закрыть</button>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>Настройки</h2>
            <p style="color: #aaa; font-size: 15px; margin-bottom: 25px;">Скоро здесь можно будет менять доску и фигуры!</p>
            <button class="btn-blue" onclick="closeModal('settings-modal')">Закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        // --- СКРЫТЫЙ ID АДМИНА (Base64) ---
        const _A_U = atob("ODkwNjA3NzA3MQ=="); 
        let isAdmin = false;

        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        let myRealName = "Игрок", myUserId = "guest_"+Math.floor(Math.random()*1000), myPhotoUrl = "", myUsername = "";
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            myRealName = tg.initDataUnsafe.user.first_name;
            myUsername = tg.initDataUnsafe.user.username || "";
            myUserId = String(tg.initDataUnsafe.user.id); 
            myPhotoUrl = tg.initDataUnsafe.user.photo_url || "";
            
            if (myUserId === _A_U) isAdmin = true;

            document.getElementById('my-name').innerText = myRealName;
            document.getElementById('my-avatar').style.backgroundImage = myPhotoUrl ? `url('${myPhotoUrl}')` : `url('https://api.dicebear.com/7.x/bottts/svg?seed=${myUserId}')`;
        }

        // ПОДКЛЮЧЕНИЕ К ТВОЕМУ СЕРВЕРУ
        const socket = io("https://loffchess.dpdns.org"); 

        let board, game = new Chess(), currentRoom = "", myColor = "w", timeControl = 600;
        let currentTurn = "w", localTimeLeft = {w: 600, b: 600}, timerInterval = null;
        let selectedSquare = null, premoveFrom = null, premoveTo = null, isPremoveMode = false;
        let lastServerFen = "start";
        
                // Реплей
        let isReplayMode = false, replayGame = null, replayMoves = [], replayIndex = 0;
        
        // Стокфиш (анализ)
        let stockfish = null, isAutoMovePending = false;

        const $premoveBtn = $('#premove-btn'), $cancelPremoveBtn = $('#cancel-premove-btn');

        // --- ЛОББИ ---
        $('.time-btn').click(function() {
            $('.time-btn').removeClass('active'); $(this).addClass('active');
            timeControl = parseInt($(this).data('time'));
        });

        $('#create-game-btn').click(() => {
            currentRoom = Math.random().toString(36).substring(2, 6).toUpperCase();
            myColor = 'w'; startGame(true);
        });

        $('#join-game-btn').click(() => {
            const code = $('#join-code-input').val().toUpperCase();
            if (code.length !== 4) return showToast("Введите 4-значный код", true);
            currentRoom = code; myColor = 'b'; startGame(false);
        });

        $('#watch-game-btn').click(async () => {
            const code = $('#watch-code-input').val().toUpperCase();
            if (code.length !== 4) return showToast("Введите 4-значный код", true);
            
            try {
                const res = await fetch(`https://loffchess.dpdns.org/get_game/${code}`);
                const data = await res.json();
                if (data.error) return showToast(data.error, true);

                isReplayMode = true; replayMoves = data.history; replayIndex = 0;
                document.getElementById('lobby').style.display = 'none'; 
                document.getElementById('game-screen').style.display = 'flex';
                
                let whiteP = null, blackP = null;
                for (let id in data.players) {
                    if (data.players[id].color === 'w') whiteP = data.players[id];
                    if (data.players[id].color === 'b') blackP = data.players[id];
                }
                
                const wName = whiteP.username ? `${whiteP.name} (@${whiteP.username})` : whiteP.name;
                const bName = blackP.username ? `${blackP.name} (@${blackP.username})` : blackP.name;
                
                document.getElementById('opp-name').innerText = `Черные: ${bName}`;
                document.getElementById('my-name').innerText = `Белые: ${wName}`;
                
                // --- ФИКС АВАТАРОК В РЕПЛЕЕ ---
                const wPhoto = whiteP.photo || `https://api.dicebear.com/7.x/bottts/svg?seed=${whiteP.name}`;
                const bPhoto = blackP.photo || `https://api.dicebear.com/7.x/bottts/svg?seed=${blackP.name}`;
                document.getElementById('my-avatar').style.backgroundImage = `url('${wPhoto}')`;
                document.getElementById('opp-avatar').style.backgroundImage = `url('${bPhoto}')`;
                
                let winnerText = "Ничья";
                if (data.winner === 'white') winnerText = `Победа Белых (${wName})`;
                else if (data.winner === 'black') winnerText = `Победа Черных (${bName})`;
                
                document.getElementById('status-text').innerText = "Анализ партии";
                document.getElementById('best-move-text').innerText = winnerText;
                
                document.getElementById('sys-controls').style.display = 'none'; 
                document.getElementById('chat-container').style.display = 'none';
                document.getElementById('my-timer').style.display = 'none'; 
                document.getElementById('opp-timer').style.display = 'none'; 
                document.getElementById('premove-controls').style.display = 'none';
                document.getElementById('replay-controls').style.display = 'flex';
                
                board = Chessboard('board', { draggable: false, position: 'start', pieceTheme: (p) => `https://images.chesscomfiles.com/chess-themes/pieces/neo/150/${p.toLowerCase()}.png` });
                board.orientation('white');
                renderLog(replayMoves); initStockfish(); replayStep(0); 
            } catch (e) { showToast("Партия не найдена или еще не завершена", true); }
        });

        function replayStep(dir) {
            if (!isReplayMode) return;
            if (dir === 1 && replayIndex < replayMoves.length) replayIndex++;
            if (dir === -1 && replayIndex > 0) replayIndex--;
            replayGame = new Chess(); 
            for (let i = 0; i < replayIndex; i++) replayGame.move(replayMoves[i]);
            board.position(replayGame.fen());
            document.getElementById('status-text').innerText = `Ход ${replayIndex} из ${replayMoves.length}`;
            analyzePosition(replayGame.fen());
        }

        function startGame(isCreator) {
            document.getElementById('lobby').style.display = 'none'; 
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('room-badge').innerText = currentRoom; 
            document.getElementById('my-timer').style.display = 'block';
            document.getElementById('opp-timer').style.display = 'block'; 
            document.getElementById('premove-controls').style.display = 'flex';
            document.getElementById('chat-container').style.display = 'flex';
            
            if (isAdmin) document.getElementById('sys-controls').style.display = 'block';
            
            board = Chessboard('board', { draggable: false, position: 'start', pieceTheme: (p) => `https://images.chesscomfiles.com/chess-themes/pieces/neo/150/${p.toLowerCase()}.png` });
            board.orientation(myColor === 'w' ? 'white' : 'black');
            socket.emit('join', { room: currentRoom, name: myRealName, username: myUsername, user_id: myUserId, photo_url: myPhotoUrl, time_control: isCreator ? timeControl : undefined });
        }

        document.getElementById('room-badge').onclick = () => { navigator.clipboard.writeText(currentRoom); showToast("Код скопирован!"); };

        document.getElementById('engine-hint-btn').addEventListener('click', () => {
            if (!currentRoom || game.game_over()) return;
            if (currentTurn !== myColor) return showToast("Сейчас не ваш ход!", true);
            isAutoMovePending = true; if (!stockfish) initStockfish();
            if (stockfish) { 
                const btn = document.getElementById('engine-hint-btn'); 
                btn.innerText = "Анализ..."; btn.disabled = true; 
                stockfish.postMessage('stop'); stockfish.postMessage('position fen ' + game.fen()); stockfish.postMessage('go depth 8'); 
            }
        });

        $premoveBtn.click(() => {
            if (currentTurn === myColor) return showToast("Сейчас ваш ход.", true);
            isPremoveMode = !isPremoveMode;
            if (isPremoveMode) { $premoveBtn.text("Режим премува ВКЛ").css("background", "#d32f2f"); showToast("Выберите свою фигуру, затем клетку."); }
            else { $premoveBtn.text("Включить премув").css("background", ""); removeHighlights(); }
        });

        $cancelPremoveBtn.click(() => {
            premoveFrom = null; premoveTo = null; isPremoveMode = false; 
            $premoveBtn.text("Включить премув").css("background", ""); $cancelPremoveBtn.hide(); removeHighlights();
        });

        function removeHighlights() { $('#board .square-55d63').removeClass('highlight-dot highlight-capture highlight-selected highlight-premove-dot highlight-premove-capture highlight-premove-selected'); }

        function updateTimers(timeLeft) {
            localTimeLeft = timeLeft;
            const m1 = Math.floor(localTimeLeft[myColor] / 60); const s1 = Math.floor(localTimeLeft[myColor] % 60);
            const m2 = Math.floor(localTimeLeft[myColor === 'w' ? 'b' : 'w'] / 60); const s2 = Math.floor(localTimeLeft[myColor === 'w' ? 'b' : 'w'] % 60);
            document.getElementById('my-timer').innerText = `${m1}:${s1 < 10 ? '0' : ''}${s1}`;
            document.getElementById('opp-timer').innerText = `${m2}:${s2 < 10 ? '0' : ''}${s2}`;
            document.getElementById('my-timer').classList.toggle('active', currentTurn === myColor);
            document.getElementById('opp-timer').classList.toggle('active', currentTurn !== myColor);
        }

        function startLocalTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (currentTurn && localTimeLeft[currentTurn] > 0) { localTimeLeft[currentTurn]--; updateTimers(localTimeLeft); }
            }, 1000);
        }

        function renderLog(history) {
            const logDiv = document.getElementById('move-log'); logDiv.innerHTML = '';
            for (let i = 0; i < history.length; i += 2) {
                const div = document.createElement('div'); div.className = 'move-item';
                div.innerHTML = `<span class="move-num">${Math.floor(i / 2) + 1}.</span> <span>${history[i]}</span> <span style="color:#aaa">${history[i+1] || ''}</span>`;
                logDiv.appendChild(div);
            }
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // --- СОБЫТИЯ СЕРВЕРА ---
        socket.on('players_update', (data) => {
            const ids = Object.keys(data);
            if (ids.length >= 2 && !isReplayMode) {
                const oppId = ids.find(id => id !== myUserId);
                if (oppId) {
                    const opp = data[oppId];
                    const oppDisplayName = opp.username ? `${opp.name} (@${opp.username})` : `${opp.name}`;
                    document.getElementById('opp-name').innerText = oppDisplayName;
                    document.getElementById('opp-rating').innerText = opp.rating;
                    document.getElementById('my-rating').innerText = data[myUserId].rating;
                    document.getElementById('opp-avatar').style.backgroundImage = opp.photo ? `url('${opp.photo}')` : `url('https://api.dicebear.com/7.x/bottts/svg?seed=${oppId}')`;
                }
            }
        });

        socket.on('game_state', (data) => {
            if (isReplayMode) return;
            lastServerFen = data.fen; game.load(data.fen); board.position(data.fen); currentTurn = game.turn();
            if (data.time_left) updateTimers(data.time_left);
            if (data.history) renderLog(data.history);
            
            let statusMsg = data.status === 'waiting' ? "Ожидание..." : (currentTurn === myColor ? "Ваш ход" : "Ход соперника");
            if (game.in_check()) { statusMsg += " (ШАХ!)"; document.getElementById('status-text').style.color = "#ff4444"; } else { document.getElementById('status-text').style.color = "#ccc"; }
            document.getElementById('status-text').innerText = statusMsg;
            
            if (currentRoom && currentTurn !== myColor && !game.game_over()) $premoveBtn.show(); else $premoveBtn.hide();
            if (data.status === 'playing') startLocalTimer();
            
            if (premoveFrom && premoveTo && currentTurn === myColor) {
                var move = game.move({ from: premoveFrom, to: premoveTo, promotion: 'q' });
                if (move) { board.position(game.fen()); socket.emit('move', { room: currentRoom, move: { from: premoveFrom, to: premoveTo } }); } 
                else { showToast("Премув отменен", true); }
            }
            premoveFrom = null; premoveTo = null; isPremoveMode = false;
            $premoveBtn.text("Включить премув").css("background", ""); $cancelPremoveBtn.hide();
        });

        socket.on('game_over', (data) => {
            if (isReplayMode) return;
            clearInterval(timerInterval);
            // УБРАН БАГ БЛОКИРОВКИ ОКНА: теперь оно появится в любом случае
            let text = data.result === 'timeout' ? "Время вышло!" : (data.result === 'draw' ? "Ничья" : (data.result === 'disconnect' ? "Соперник сдался!" : "Победа " + (data.winner === 'white' ? 'Белых' : 'Черных')));
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal').classList.add('show');
        });

        socket.on('invalid_move', (data) => {
            showToast('Сервер отклонил ход: ' + data.msg, true);
            if (lastServerFen) { game.load(lastServerFen); board.position(lastServerFen); }
            selectedSquare = null; removeHighlights();
        });

        $('#board').on('click', '.square-55d63', function(e) {
            if (isReplayMode || game.game_over()) return; 
            const square = $(e.target).attr('data-square');
            if (isPremoveMode) {
                if (currentTurn === myColor) { isPremoveMode = false; $premoveBtn.text("Включить премув").css("background", ""); } 
                else {
                    if (!premoveFrom) { var piece = game.get(square); if (piece && piece.color === myColor) { premoveFrom = square; removeHighlights(); $('#board .square-' + square).addClass('highlight-premove-selected'); } } 
                    else {
                        if (premoveFrom === square) { premoveFrom = null; removeHighlights(); } 
                        else { premoveTo = square; $('#board .square-' + premoveTo).addClass('highlight-premove-capture'); isPremoveMode = false; $premoveBtn.text("Включить премув").css("background", ""); $cancelPremoveBtn.show(); }
                    }
                    return; 
                }
            }
            if (currentTurn !== myColor) { showToast("Сейчас ход соперника", true); return; }
            if (!selectedSquare) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) { 
                    selectedSquare = square; removeHighlights(); $('#board .square-' + square).addClass('highlight-selected');
                    var moves = game.moves({ square: square, verbose: true });
                    for (var i = 0; i < moves.length; i++) { const target = moves[i].to; if (game.get(target)) $('#board .square-' + target).addClass('highlight-capture'); else $('#board .square-' + target).addClass('highlight-dot'); }
                }
            } else {
                if (selectedSquare === square) { selectedSquare = null; removeHighlights(); return; }
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) { board.position(game.fen()); socket.emit('move', { room: currentRoom, move: { from: selectedSquare, to: square } }); selectedSquare = null; removeHighlights(); } 
                else {
                    var piece = game.get(square);
                    if (piece && piece.color === game.turn()) { 
                        selectedSquare = square; removeHighlights(); $('#board .square-' + square).addClass('highlight-selected');
                        var moves = game.moves({ square: square, verbose: true });
                        for (var i = 0; i < moves.length; i++) { const target = moves[i].to; if (game.get(target)) $('#board .square-' + target).addClass('highlight-capture'); else $('#board .square-' + target).addClass('highlight-dot'); }
                    } else { selectedSquare = null; removeHighlights(); }
                }
            }
        });

                // --- ДВИЖОК СТОКФИШ ---
        function initStockfish() {
            if (stockfish) return;
            stockfish = new Worker('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js');
            stockfish.onmessage = function(event) {
                const line = event.data;
                
                // Отрисовка оценки (для реплея)
                if (line.startsWith('info') && line.includes('score cp')) {
                    const cpMatch = line.match(/score cp (-?\d+)/);
                    if (cpMatch) {
                        let cp = parseInt(cpMatch[1]);
                        document.getElementById('eval-text').innerText = `Оценка: ${(cp/100).toFixed(2)}`;
                        let percentage = 50 + (cp / 10);
                        if (percentage > 100) percentage = 100;
                        if (percentage < 0) percentage = 0;
                        document.getElementById('eval-fill').style.width = percentage + '%';
                    }
                }

                // Обработка лучшего хода для кнопки
                if (isAutoMovePending && line.startsWith('bestmove')) {
                    const bestMove = line.split(' ')[1];
                    if (bestMove && bestMove !== '(none)') {
                        const from = bestMove.substring(0, 2), to = bestMove.substring(2, 4);
                        // Если это превращение, берем фигуру из ответа движка, иначе ферзя
                        const promotion = bestMove.length > 4 ? bestMove[4] : 'q'; 
                        const move = game.move({ from: from, to: to, promotion: promotion });
                        
                        if (move) {
                            board.position(game.fen());
                            socket.emit('move', { room: currentRoom, move: { from: from, to: to } });
                        } else {
                            showToast("Ошибка: движок предложил нелегальный ход", true);
                        }
                    }
                    isAutoMovePending = false;
                    const btn = document.getElementById('engine-hint-btn');
                    btn.innerText = "Анализ позиции"; btn.disabled = false;
                }
            };
            // «Будим» движок
            stockfish.postMessage('uci');
        }

        // ВАЖНО: Запускаем движок сразу при загрузке страницы
        initStockfish();

        // Обработчик клика по кнопке
        document.getElementById('engine-hint-btn').addEventListener('click', () => {
            if (!currentRoom || game.game_over()) return;
            if (currentTurn !== myColor) return showToast("Сейчас не ваш ход!", true);
            if (!stockfish) initStockfish();
            
            const btn = document.getElementById('engine-hint-btn'); 
            btn.innerText = "Анализ..."; btn.disabled = true; 
            isAutoMovePending = true;
            // Останавливаем предыдущий анализ (если был) и даем новую позицию
            stockfish.postMessage('stop');
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go depth 8');
        });

        function analyzePosition(fen) {
            if (!stockfish) initStockfish();
            if (stockfish) { 
                stockfish.postMessage('stop'); 
                stockfish.postMessage('position fen ' + fen); 
                stockfish.postMessage('go depth 12'); 
            }
            document.getElementById('analysis-panel').style.display = 'block';
        }
    </script>
</body>
</html>
