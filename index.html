<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы Онлайн</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1d22);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #2c2e33);
            --accent: var(--tg-theme-button-color, #5288c1);
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden; /* Блокируем скролл */
            padding-top: 10px;
        }

        /* Панель игрока (Сверху и Снизу) */
        .player-bar {
            width: 90%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--secondary-bg);
            border-radius: 12px;
            margin: 5px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .player-info { display: flex; align-items: center; gap: 12px; }
        
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background-color: #555; background-size: cover;
        }

        .name { font-weight: 600; font-size: 15px; }
        .timer { font-size: 14px; font-weight: bold; color: #aaa; }

        /* Доска */
        #board-container { 
            position: relative; 
            width: 95vw; 
            max-width: 400px; 
            margin: 10px 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        #board { width: 100%; touch-action: none; }

        /* Координаты */
        .notation-322f9 { display: none; }

        /* Стили для точек и колец */
        .square-55d63 { position: relative; cursor: pointer !important; }
        .board-b72b1 .piece-417db { pointer-events: none !important; -webkit-user-drag: none !important; }
        
        .highlight-dot::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 32%; height: 32%; border-radius: 50%; background-color: rgba(0, 0, 0, 0.2); pointer-events: none;
        }
        .highlight-capture::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; height: 85%; border-radius: 50%; border: 8px solid rgba(0, 0, 0, 0.2); box-sizing: border-box; pointer-events: none;
        }
        .black-3c85d .highlight-dot::after { background-color: rgba(255, 255, 255, 0.3); }
        .black-3c85d .highlight-capture::after { border-color: rgba(255, 255, 255, 0.3); }
        .highlight-selected { background-color: rgba(255, 255, 0, 0.4) !important; }

        /* Статус бар */
        #status-panel { 
            margin-top: 5px; padding: 8px 20px; border-radius: 20px; 
            background: var(--secondary-bg); font-weight: bold; font-size: 14px;
            text-align: center; min-width: 200px; transition: all 0.3s ease;
        }
        .check-warning { color: #ff4444; background-color: rgba(255, 68, 68, 0.1); }

        /* Кнопки управления */
        .controls { 
            margin-top: 15px; display: flex; gap: 10px; width: 90%; max-width: 400px; justify-content: center;
        }
        button { 
            flex: 1; padding: 12px; border: none; border-radius: 12px; 
            font-size: 15px; font-weight: bold; cursor: pointer;
            background-color: var(--accent); color: white;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.96); opacity: 0.8; }
        .btn-green { background-color: #4CAF50; }
        .btn-red { background-color: #f44336; }

        /* Модальное окно (Победа/Поражение) */
        #modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 1000; 
            justify-content: center; align-items: center; flex-direction: column; 
            backdrop-filter: blur(5px);
        }
        .modal-card {
            background: var(--secondary-bg); padding: 30px; border-radius: 20px;
            text-align: center; width: 80%; max-width: 300px;
        }
        .modal-card h2 { color: white; margin-top: 0; font-size: 26px; }
    </style>
</head>
<body>

    <!-- Противник -->
    <div class="player-bar">
        <div class="player-info">
            <div class="avatar" id="opp-avatar" style="background-image: url('https://api.dicebear.com/7.x/bottts/svg?seed=Opponent');"></div>
            <div>
                <div class="name" id="opp-name">Ожидание...</div>
                <div class="timer">10:00</div>
            </div>
        </div>
    </div>

    <!-- Доска -->
    <div id="board-container">
        <div id="board"></div>
    </div>

    <!-- Ты -->
    <div class="player-bar">
        <div class="player-info">
            <div class="avatar" id="my-avatar" style="background-image: url('https://api.dicebear.com/7.x/bottts/svg?seed=Player');"></div>
            <div>
                <div class="name" id="my-name">Вы</div>
                <div class="timer">10:00</div>
            </div>
        </div>
    </div>

    <div id="status-panel">Нажмите "Создать игру"</div>

    <div class="controls">
        <button id="create-game-btn" class="btn-green">Создать</button>
        <button id="join-game-btn">Войти</button>
        <button id="restart-btn" class="btn-red">Сброс</button>
    </div>

    <!-- Модалка -->
    <div id="modal">
        <div class="modal-card">
            <h2 id="modal-text">МАТ!</h2>
            <button onclick="closeModal()">Ок</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Устанавливаем имена и аватарки из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('my-name').innerText = user.first_name;
            document.getElementById('my-avatar').style.backgroundImage = `url('https://api.dicebear.com/7.x/bottts/svg?seed=${user.id}')`;
        }

        const SERVER_URL = 'https://chess-server-gh0q.onrender.com';
        const socket = io(SERVER_URL);

        var board = null;
        var game = new Chess();
        var selectedSquare = null;
        var currentRoom = null;
        var myColor = null; // 'w' или 'b'

        var $status = document.getElementById('status-panel');

        // --- ЛОГИКА ДОСКИ ---
        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight-dot highlight-capture highlight-selected');
        }

        function highlightMoves(source) {
            removeHighlights();
            $('#board .square-' + source).addClass('highlight-selected');
            var moves = game.moves({ square: source, verbose: true });
            for (var i = 0; i < moves.length; i++) {
                var targetSquare = moves[i].to;
                var pieceOnTarget = game.get(targetSquare);
                if (pieceOnTarget) {
                    $('#board .square-' + targetSquare).addClass('highlight-capture');
                } else {
                    $('#board .square-' + targetSquare).addClass('highlight-dot');
                }
            }
        }

        function onSquareClick(square) {
            if (game.game_over() || !currentRoom || game.turn() !== myColor) return;

            if (!selectedSquare) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    highlightMoves(square);
                }
            } else {
                if (selectedSquare === square) {
                    selectedSquare = null;
                    removeHighlights();
                    return;
                }
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) {
                    board.position(game.fen());
                    updateStatus();
                    if (socket.connected) {
                        socket.emit('move', { room: currentRoom, move: { from: selectedSquare, to: square } });
                    }
                    selectedSquare = null;
                    removeHighlights();
                } else {
                    var piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        highlightMoves(square);
                    } else {
                        selectedSquare = null;
                        removeHighlights();
                    }
                }
            }
        }

        function updateStatus() {
            if (game.in_checkmate()) {
                var winner = game.turn() === 'w' ? 'Черные' : 'Белые';
                $status.innerHTML = 'МАТ! Победили ' + winner;
                $status.classList.add('check-warning');
                document.getElementById('modal-text').innerText = 'МАТ! Победили ' + winner;
                document.getElementById('modal').style.display = 'flex';
            } else if (game.in_draw()) {
                $status.innerHTML = 'НИЧЬЯ';
                $status.classList.remove('check-warning');
            } else {
                var turnText = game.turn() === 'w' ? 'Белые' : 'Черные';
                $status.innerHTML = 'Ход: ' + turnText;
                $status.classList.remove('check-warning');
                if (game.in_check()) {
                    $status.innerHTML += ' (ШАХ!)';
                    $status.classList.add('check-warning');
                }
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        board = Chessboard('board', {
            draggable: false,
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        $('#board').on('click', '.square-55d63', function(e) {
            e.preventDefault();
            onSquareClick($(this).attr('data-square'));
        });

        // --- КНОПКИ ---
        document.getElementById('create-game-btn').onclick = () => {
            const roomId = Math.random().toString(36).substring(2, 6).toUpperCase();
            currentRoom = roomId;
            myColor = 'w'; // Создатель играет белыми
            
            // Белые внизу
            board.orientation('white'); 
            
            socket.emit('join', { room: roomId });
            $status.innerHTML = `Вы: <b>Белые</b>. ID: <b>${roomId}</b>`;
        };

        document.getElementById('join-game-btn').onclick = () => {
            const roomId = prompt("Введите ID комнаты:");
            if (roomId) {
                currentRoom = roomId.toUpperCase();
                myColor = 'b'; // Присоединившийся играет черными
                
                // ЧЕРНЫЕ ВНИЗУ!
                board.orientation('black'); 
                
                socket.emit('join', { room: currentRoom });
                $status.innerHTML = `Вы: <b>Черные</b>. Комната: <b>${currentRoom}</b>`;
            }
        };

        document.getElementById('restart-btn').onclick = () => {
            if(currentRoom) {
                socket.emit('join', { room: currentRoom }); 
            }
        };

        // --- СОБЫТИЯ СЕРВЕРА ---
        socket.on('connect', () => {
            if (!currentRoom) $status.innerText = "Подключено. Создайте игру!";
        });

        socket.on('board_state', (data) => {
            game.load(data.fen);
            board.position(data.fen);
            selectedSquare = null;
            removeHighlights();
            updateStatus();
        });

        socket.on('game_over', (data) => {
            if (data.result === 'checkmate') {
                document.getElementById('modal-text').innerText = `МАТ! Победили ${data.winner === 'white' ? 'Белые' : 'Черные'}`;
            } else {
                document.getElementById('modal-text').innerText = 'Ничья.';
            }
            document.getElementById('modal').style.display = 'flex';
        });
    </script>
</body>
</html>
