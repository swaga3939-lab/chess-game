<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шахматы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <style>
        :root { --bg-gradient: radial-gradient(circle at top, #2a2a2a 0%, #121212 100%); --panel-bg: rgba(255, 255, 255, 0.05); --panel-border: rgba(255, 255, 255, 0.1); --accent-green: #81b64c; --accent-blue: #42a5f5; }
        body { background: var(--bg-gradient); color: #f0f0f0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; min-height: 100vh; padding-bottom: 20px; overflow-x: hidden; }
        
        #lobby { display: flex; flex-direction: column; width: 90%; max-width: 400px; padding: 20px; background: var(--panel-bg); border-radius: 16px; margin-top: 30px; border: 1px solid var(--panel-border); box-sizing: border-box; }
        #lobby h2 { margin-top: 0; margin-bottom: 15px; font-size: 18px; }
        .time-options { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .time-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--panel-border); background: transparent; color: white; cursor: pointer; font-weight: bold; }
        .time-btn.active { background: var(--accent-green); border-color: var(--accent-green); }
        .join-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--panel-border); background: rgba(0,0,0,0.3); color: white; font-size: 16px; text-align: center; text-transform: uppercase; margin-bottom: 10px; box-sizing: border-box; }

        #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        .player-bar { width: 92%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin: 5px 0; padding: 8px 12px; background: var(--panel-bg); border-radius: 12px; }
        .player-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #333; background-size: cover; background-position: center; }
        .name-box { display: flex; flex-direction: column; }
        .name { font-weight: 600; font-size: 15px; }
        .rating { font-size: 12px; color: #aaa; }
        .timer { font-size: 20px; font-weight: bold; font-family: monospace; padding: 6px 12px; background: rgba(0,0,0,0.5); border-radius: 6px; color: #888; }
        .timer.active { background: #fff; color: #000; }
        
        #board-container { position: relative; width: 92vw; max-width: 400px; margin: 10px 0; border-radius: 8px; overflow: hidden; background-color: #f0d9b5; aspect-ratio: 1 / 1; }
        #board { width: 100%; height: 100%; touch-action: none; }
        .notation-322f9 { display: none; }
        .square-55d63 { position: relative; cursor: pointer !important; }
        .board-b72b1 .piece-417db { pointer-events: none !important; }
        
        .highlight-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30%; height: 30%; border-radius: 50%; background-color: rgba(0, 0, 0, 0.2); }
        .highlight-capture::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 85%; border-radius: 50%; border: 7px solid rgba(0, 0, 0, 0.2); box-sizing: border-box; }
        .highlight-selected { background-color: rgba(255, 215, 0, 0.4) !important; }
        
        .highlight-premove-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30%; height: 30%; border-radius: 50%; background-color: rgba(156, 39, 176, 0.7); }
        .highlight-premove-capture::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 85%; border-radius: 50%; border: 7px solid rgba(156, 39, 176, 0.7); box-sizing: border-box; }
        .highlight-premove-selected { background-color: rgba(156, 39, 176, 0.4) !important; }

        #status-bar { width: 92%; max-width: 380px; display: flex; justify-content: space-between; padding: 10px; margin-top: 5px; background: var(--panel-bg); border-radius: 10px; }
        .room-badge { background: rgba(129, 182, 76, 0.2); color: var(--accent-green); padding: 4px 10px; border-radius: 6px; font-family: monospace; cursor: pointer; }
        
        #chat-container { width: 92%; max-width: 380px; height: 150px; background: var(--panel-bg); border-radius: 10px; margin-top: 10px; display: flex; flex-direction: column; border: 1px solid var(--panel-border); overflow: hidden; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 14px; display: flex; flex-direction: column; gap: 5px; }
        .chat-msg { padding: 4px 8px; border-radius: 6px; max-width: 80%; word-wrap: break-word; }
        .chat-msg.my { background: rgba(129, 182, 76, 0.3); align-self: flex-end; }
        .chat-msg.opp { background: rgba(255, 255, 255, 0.1); align-self: flex-start; }
        #chat-input-area { display: flex; padding: 5px; border-top: 1px solid var(--panel-border); background: rgba(0,0,0,0.2); }
        #chat-input { flex: 1; background: transparent; border: none; color: white; padding: 8px; font-size: 14px; outline: none; }
        #chat-send { background: var(--accent-green); border: none; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-left: 5px; }

        button { padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; width: 100%; margin-bottom: 10px; }
        .btn-green { background: var(--accent-green); } .btn-blue { background: var(--accent-blue); } .btn-red { background: #ef5350; } .btn-purple { background: #ab47bc; } .btn-orange { background: #ff9800; }
        .btn-cheat { background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%); border: 2px solid #ff4081; }
        .btn-cheat:disabled { opacity: 0.7; cursor: not-allowed; filter: grayscale(1); }

        #analysis-panel { display: none; width: 92%; max-width: 380px; background: var(--panel-bg); border-radius: 10px; padding: 10px; margin-bottom: 10px; border: 1px solid var(--panel-border); text-align: center; }
        .eval-bar-container { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin-bottom: 5px; }
        .eval-bar-fill { height: 100%; background: #fff; width: 50%; transition: width 0.3s; }
        .eval-text { font-weight: bold; font-size: 16px; }
        .best-move-text { font-size: 14px; color: var(--accent-green); margin-top: 5px; }
        #move-quality { font-size: 18px; font-weight: bold; margin-top: 8px; display: flex; justify-content: center; gap: 8px; }
        .quality-badge { padding: 4px 10px; border-radius: 6px; font-size: 14px; }
        .q-blunder { background: #ff4444; } .q-mistake { background: #ff9800; } .q-inaccuracy { background: #ffeb3b; color: black; } .q-good { background: #81b64c; } .q-best { background: #2196f3; }

        #move-log { width: 92%; max-width: 380px; height: 80px; overflow-y: auto; background: var(--panel-bg); border-radius: 8px; padding: 10px; font-family: monospace; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 5px 15px; }
        .move-item { display: flex; gap: 5px; width: 45%; }
        .move-num { color: #666; }

        #replay-controls { display: none; width: 92%; max-width: 380px; justify-content: space-between; gap: 10px; margin-top: 10px; }
        .replay-btn { background: #444; padding: 10px; border-radius: 8px; font-size: 20px; }
        #premove-controls { display: none; width: 92%; max-width: 380px; gap: 10px; margin-top: 10px; }

        #modal, #invite-modal, #leaderboard-modal, #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: #222; padding: 30px; border-radius: 16px; text-align: center; width: 80%; max-width: 300px; border: 1px solid var(--panel-border); }
        .modal-card h2 { margin-top: 0; margin-bottom: 20px; font-size: 24px; }
        #leaderboard-list { text-align: left; margin-bottom: 20px; max-height: 200px; overflow-y: auto;}
        .lb-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <div id="lobby">
        <h2>Создать игру</h2>
        <div class="time-options">
            <button class="time-btn" data-time="60">Пуля (1м)</button>
            <button class="time-btn" data-time="180">Блиц (3м)</button>
            <button class="time-btn active" data-time="600">Рапид (10м)</button>
        </div>
        <button id="create-game-btn" class="btn-green">Создать</button>
        
        <h2 style="margin-top: 20px;">Войти по коду</h2>
        <input type="text" id="join-code-input" class="join-input" placeholder="Код (например, A1B2)" maxlength="4">
        <button id="join-game-btn" class="btn-blue">Присоединиться</button>
        
        <h2 style="margin-top: 20px;">Смотреть и анализировать</h2>
        <input type="text" id="watch-code-input" class="join-input" placeholder="Код партии" maxlength="4">
        <button id="watch-game-btn" style="background: #555;">Смотреть партию</button>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="leaderboard-btn" class="btn-blue" style="flex: 1;">Топ</button>
            <button id="settings-btn" class="btn-purple" style="flex: 1;">Настройки</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="player-bar">
            <div class="player-info">
                <div class="avatar" id="opp-avatar"></div>
                <div class="name-box">
                    <div class="name" id="opp-name">Ожидание...</div>
                    <div class="rating" id="opp-rating">1200</div>
                </div>
            </div>
            <div class="timer" id="opp-timer">--:--</div>
        </div>

        <div id="board-container"><div id="board"></div></div>

        <div class="player-bar">
            <div class="player-info">
                <div class="avatar" id="my-avatar"></div>
                <div class="name-box">
                    <div class="name" id="my-name">Вы</div>
                    <div class="rating" id="my-rating">1200</div>
                </div>
            </div>
            <div class="timer" id="my-timer">--:--</div>
        </div>

        <div id="status-bar">
            <div id="status-text">...</div>
            <div class="room-badge" id="room-badge">----</div>
        </div>

        <div id="chat-container" style="display: none;">
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Сообщение...">
                <button id="chat-send">➤</button>
            </div>
        </div>

        <div id="premove-controls">
            <button id="premove-btn" class="btn-purple">Включить премув</button>
            <button id="cancel-premove-btn" class="btn-orange" style="display: none;">Отменить</button>
        </div>

        <div id="cheat-controls" style="display: none; width: 92%; max-width: 380px; margin-top: 10px;">
            <button id="auto-move-btn" class="btn-cheat">Сделать лучший ход</button>
        </div>

        <div id="analysis-panel">
            <div class="eval-bar-container"><div class="eval-bar-fill" id="eval-fill"></div></div>
            <div class="eval-text" id="eval-text">Оценка: 0.00</div>
            <div id="move-quality"></div>
            <div class="best-move-text" id="best-move-text">Лучший ход: ...</div>
        </div>

        <div id="replay-controls">
            <button class="replay-btn" onclick="replayStep(-1)">◀</button>
            <button class="replay-btn" onclick="replayStep(1)">▶</button>
        </div>

        <div id="move-log"></div>
    </div>

    <div id="modal"><div class="modal-card"><h2 id="modal-text"></h2><button class="btn-blue" onclick="location.reload()">В лобби</button></div></div>
    
    <div id="invite-modal">
        <div class="modal-card">
            <h2 style="margin-top:0;">Приглашение</h2>
            <img id="invite-avatar" src="" style="width:60px; height:60px; border-radius:50%; margin-bottom:10px; background:#333;">
            <p><b id="invite-name"></b> приглашает вас на партию.</p>
            <p id="invite-time" style="color:#aaa;"></p>
            <button id="accept-invite-btn" class="btn-green">Принять</button>
            <button onclick="document.getElementById('invite-modal').style.display='none'" class="btn-red">Отмена</button>
        </div>
    </div>

    <div id="leaderboard-modal">
        <div class="modal-card">
            <h2>Лидерборд</h2>
            <div id="leaderboard-list"></div>
            <button onclick="document.getElementById('leaderboard-modal').style.display='none'" class="btn-blue">Закрыть</button>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-card">
            <h2>Настройки</h2>
            <p style="color: #aaa;">Скоро здесь можно будет менять доску и фигуры!</p>
            <button onclick="document.getElementById('settings-modal').style.display='none'" class="btn-blue">Закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const CHEAT_USER_ID = "8906077071"; 
        let isCheatUser = false;
        let myRealName = "Игрок", myUserId = "guest_"+Math.floor(Math.random()*1000), myPhotoUrl = "";
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let fName = tg.initDataUnsafe.user.first_name;
            let uName = tg.initDataUnsafe.user.username;
            myRealName = uName ? `${fName} | @${uName}` : fName;
            myUserId = String(tg.initDataUnsafe.user.id); 
            myPhotoUrl = tg.initDataUnsafe.user.photo_url || "";
            if (myUserId === CHEAT_USER_ID) isCheatUser = true;

            document.getElementById('my-name').innerText = myRealName;
            document.getElementById('my-avatar').style.backgroundImage = myPhotoUrl ? `url('${myPhotoUrl}')` : `url('https://api.dicebear.com/7.x/bottts/svg?seed=${myUserId}')`;
        }

        const SERVER_URL = 'https://loffchess.dpdns.org';
        const socket = io(SERVER_URL, { transports: ['websocket'] });

        var board = null, game = new Chess();
        var selectedSquare = null, currentRoom = null, myColor = null;
        var timeControl = 600, timerInterval = null, localTimeLeft = { w: 600, b: 600 }, currentTurn = 'w';
        var isReplayMode = false, replayMoves = [], replayIndex = 0, replayGame = new Chess();
        var stockfish = null, lastServerFen = ""; 
        var premoveFrom = null, premoveTo = null, isPremoveMode = false;
        var evalHistory = [], currentAnalyzeIndex = 0, isAutoMovePending = false;

        var $premoveBtn = document.getElementById('premove-btn');
        var $cancelPremoveBtn = document.getElementById('cancel-premove-btn');

        document.getElementById('leaderboard-btn').onclick = async () => {
            const res = await fetch(`${SERVER_URL}/leaderboard`);
            const data = await res.json();
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            data.forEach((p, i) => {
                list.innerHTML += `<div class="lb-item"><span>${i+1}. ${p.name}</span> <b style="color:var(--accent-green);">${p.rating}</b></div>`;
            });
            document.getElementById('leaderboard-modal').style.display = 'flex';
        };
        document.getElementById('settings-btn').onclick = () => document.getElementById('settings-modal').style.display = 'flex';

        document.getElementById('chat-send').onclick = () => {
            const input = document.getElementById('chat-input');
            if (input.value.trim() && currentRoom) {
                socket.emit('chat_message', { room: currentRoom, message: `${myRealName}: ${input.value.trim()}` });
                input.value = '';
            }
        };

        socket.on('chat_message', (msg) => {
            const chat = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = msg.startsWith(myRealName) ? 'chat-msg my' : 'chat-msg opp';
            div.innerText = msg;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        });

        socket.on('opponent_disconnected', (data) => {
            tg.showAlert(`Соперник отключился! Если он не вернется через ${data.time} секунд, вы победите.`);
        });

        function initStockfish() {
            if (stockfish) return;
            fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')
                .then(res => res.text())
                .then(text => {
                    const blob = new Blob([text], { type: 'application/javascript' });
                    stockfish = new Worker(URL.createObjectURL(blob));
                    stockfish.postMessage('uci');
                    stockfish.onmessage = function(event) {
                        const line = event.data;
                        let score = null, mateIn = null, bestMove = null;
                        if (line.includes('score cp')) { const match = line.match(/score cp (-?\d+)/); if (match) score = parseInt(match[1]) / 100.0; }
                        if (line.includes('score mate')) { const match = line.match(/score mate (-?\d+)/); if (match) mateIn = parseInt(match[1]); }
                        if (line.includes('bestmove')) bestMove = line.split(' ')[1];

                        if (isAutoMovePending && bestMove) {
                            isAutoMovePending = false;
                            if (bestMove && bestMove !== '(none)') {
                                const move = game.move({ from: bestMove.substring(0, 2), to: bestMove.substring(2, 4), promotion: 'q' });
                                if (move) { board.position(game.fen()); socket.emit('move', { room: currentRoom, move: { from: bestMove.substring(0, 2), to: bestMove.substring(2, 4) } }); }
                            }
                            const btn = document.getElementById('auto-move-btn');
                            btn.innerText = "Сделать лучший ход"; btn.disabled = false;
                            return;
                        }
                                                if (score !== null || mateIn !== null) {
                            let displayText = mateIn !== null ? `Мат через ${Math.abs(mateIn)}` : `Оценка: ${(score > 0 ? '+' : '') + score.toFixed(2)}`;
                            document.getElementById('eval-text').innerText = displayText;
                            let normalizedScore = mateIn !== null ? (mateIn > 0 ? 10 : -10) : score;
                            if (replayGame.turn() === 'b') normalizedScore = -normalizedScore;
                            updateEvalBar(normalizedScore);
                            evalHistory[currentAnalyzeIndex] = normalizedScore;
                            if (currentAnalyzeIndex > 0 && evalHistory[currentAnalyzeIndex - 1] !== undefined) calculateMoveQuality(evalHistory[currentAnalyzeIndex - 1], normalizedScore, bestMove);
                        }
                        if (bestMove && bestMove !== '(none)' && isReplayMode) document.getElementById('best-move-text').innerText = `Лучший ход: ${bestMove}`;
                    };
                }).catch(e => console.log("Stockfish Error:", e));
        }

        function analyzePosition(fen, index) {
            if (!stockfish) initStockfish();
            currentAnalyzeIndex = index;
            document.getElementById('eval-text').innerText = "Анализ...";
            document.getElementById('move-quality').innerHTML = ""; 
            if (stockfish) { stockfish.postMessage('stop'); stockfish.postMessage('position fen ' + fen); stockfish.postMessage('go depth 14'); }
        }

        function updateEvalBar(score) {
            document.getElementById('eval-fill').style.width = (50 + (Math.max(-5, Math.min(5, score)) * 10)) + '%';
        }

        function calculateMoveQuality(prevEval, currentEval, bestMoveUCI) {
            let drop = (replayGame.turn() === 'b') ? (prevEval - currentEval) : (currentEval - prevEval);
            let qualityText = "", badgeClass = "";
            let history = replayGame.history({verbose: true});
            let playedMoveUCI = history.length > 0 ? (history[history.length - 1].from + history[history.length - 1].to + (history[history.length - 1].promotion || '')) : "";

            if (playedMoveUCI === bestMoveUCI && drop < 0.5) { qualityText = "Лучший ход"; badgeClass = "q-best"; }
            else if (drop > 2.0) { qualityText = "Зевок"; badgeClass = "q-blunder"; }
            else if (drop > 1.0) { qualityText = "Ошибка"; badgeClass = "q-mistake"; }
            else if (drop > 0.5) { qualityText = "Неточность"; badgeClass = "q-inaccuracy"; }
            else { qualityText = "Хороший ход"; badgeClass = "q-good"; }

            let innerHtml = `<span class="quality-badge ${badgeClass}">${qualityText}</span>`;
            if (drop > 0.5) innerHtml += ` <span style="color:#aaa; font-size:14px;">(потеря -${drop.toFixed(1)})</span>`;
            document.getElementById('move-quality').innerHTML = innerHtml;
        }

        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                timeControl = parseInt(btn.getAttribute('data-time'));
            }
        });

        document.getElementById('create-game-btn').onclick = () => { currentRoom = Math.random().toString(36).substring(2, 6).toUpperCase(); myColor = 'w'; startGame(true); };

        document.getElementById('join-game-btn').onclick = async () => {
            const code = document.getElementById('join-code-input').value.toUpperCase().trim();
            if (code.length !== 4) return tg.showAlert("Введите 4-символьный код!");
            try {
                const res = await fetch(`${SERVER_URL}/get_game_info/${code}`);
                const data = await res.json();
                if (data.status !== 'waiting') return tg.showAlert("В эту партию уже нельзя войти.");
                document.getElementById('invite-name').innerText = data.creator_name;
                document.getElementById('invite-avatar').src = data.creator_photo || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + data.creator_name;
                document.getElementById('invite-time').innerText = `Контроль времени: ${data.time_control / 60} мин.`;
                document.getElementById('invite-modal').style.display = 'flex';
                document.getElementById('accept-invite-btn').onclick = () => {
                    document.getElementById('invite-modal').style.display = 'none';
                    currentRoom = code; myColor = 'b'; startGame(false);
                };
            } catch (e) { tg.showAlert("Ошибка: Партия не найдена."); }
        };

        document.getElementById('watch-game-btn').onclick = async () => {
            const code = document.getElementById('watch-code-input').value.toUpperCase().trim();
            if (code.length !== 4) return tg.showAlert("Введите 4-символьный код!");
            try {
                const res = await fetch(`${SERVER_URL}/get_game/${code}`);
                const data = await res.json();
                isReplayMode = true; currentRoom = code; replayMoves = data.history || []; replayIndex = 0; evalHistory = [];
                document.getElementById('lobby').style.display = 'none'; document.getElementById('game-screen').style.display = 'flex';
                document.getElementById('room-badge').innerText = currentRoom; document.getElementById('replay-controls').style.display = 'flex';
                document.getElementById('analysis-panel').style.display = 'block'; document.getElementById('status-text').innerText = "Анализ партии";
                document.getElementById('cheat-controls').style.display = 'none'; document.getElementById('chat-container').style.display = 'none';
                document.getElementById('my-timer').style.display = 'none'; document.getElementById('opp-timer').style.display = 'none'; document.getElementById('premove-controls').style.display = 'none';
                board = Chessboard('board', { draggable: false, position: 'start', pieceTheme: (p) => `https://images.chesscomfiles.com/chess-themes/pieces/neo/150/${p.toLowerCase()}.png` });
                board.orientation('white');
                renderLog(replayMoves); initStockfish(); replayStep(0); 
            } catch (e) { tg.showAlert(e.message); }
        };

        function replayStep(dir) {
            if (!isReplayMode) return;
            if (dir === 1 && replayIndex < replayMoves.length) replayIndex++;
            if (dir === -1 && replayIndex > 0) replayIndex--;
            replayGame = new Chess(); for (let i = 0; i < replayIndex; i++) replayGame.move(replayMoves[i]);
            board.position(replayGame.fen());
            document.getElementById('status-text').innerText = `Ход ${replayIndex} из ${replayMoves.length}`;
            analyzePosition(replayGame.fen(), replayIndex);
        }

        function startGame(isCreator) {
            document.getElementById('lobby').style.display = 'none'; document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('room-badge').innerText = currentRoom; document.getElementById('my-timer').style.display = 'block';
            document.getElementById('opp-timer').style.display = 'block'; document.getElementById('premove-controls').style.display = 'flex';
            document.getElementById('chat-container').style.display = 'flex';
            if (isCheatUser) document.getElementById('cheat-controls').style.display = 'block';
            board = Chessboard('board', { draggable: false, position: 'start', pieceTheme: (p) => `https://images.chesscomfiles.com/chess-themes/pieces/neo/150/${p.toLowerCase()}.png` });
            board.orientation(myColor === 'w' ? 'white' : 'black');
            socket.emit('join', { room: currentRoom, name: myRealName, user_id: myUserId, photo_url: myPhotoUrl, time_control: isCreator ? timeControl : undefined });
        }

        document.getElementById('room-badge').onclick = () => { navigator.clipboard.writeText(currentRoom); tg.showAlert("Код скопирован!"); };

        document.getElementById('auto-move-btn').addEventListener('click', () => {
            if (!currentRoom || game.game_over()) return;
            if (currentTurn !== myColor) return tg.showAlert("Сейчас не ваш ход!");
            isAutoMovePending = true; if (!stockfish) initStockfish();
            if (stockfish) { const btn = document.getElementById('auto-move-btn'); btn.innerText = "Ищу ход..."; btn.disabled = true; stockfish.postMessage('stop'); stockfish.postMessage('position fen ' + game.fen()); stockfish.postMessage('go depth 8'); }
        });

        $premoveBtn.addEventListener('click', () => {
            if (currentTurn === myColor) return tg.showAlert("Сейчас ваш ход.");
            isPremoveMode = !isPremoveMode;
            if (isPremoveMode) { $premoveBtn.innerText = "Режим премува ВКЛ"; $premoveBtn.style.background = "#d32f2f"; tg.showAlert("Выберите свою фигуру, затем клетку."); }
            else { $premoveBtn.innerText = "Включить премув"; $premoveBtn.style.background = ""; removeHighlights(); }
        });

        $cancelPremoveBtn.addEventListener('click', () => {
            premoveFrom = null; premoveTo = null; isPremoveMode = false; $premoveBtn.innerText = "Включить премув"; $premoveBtn.style.background = ""; $cancelPremoveBtn.style.display = 'none'; removeHighlights();
        });

        function removeHighlights() { $('#board .square-55d63').removeClass('highlight-dot highlight-capture highlight-selected highlight-premove-dot highlight-premove-capture highlight-premove-selected'); }

        function updateTimers(timeLeft) {
            localTimeLeft = timeLeft;
            const m1 = Math.floor(localTimeLeft[myColor] / 60); const s1 = Math.floor(localTimeLeft[myColor] % 60);
            const m2 = Math.floor(localTimeLeft[myColor === 'w' ? 'b' : 'w'] / 60); const s2 = Math.floor(localTimeLeft[myColor === 'w' ? 'b' : 'w'] % 60);
            document.getElementById('my-timer').innerText = `${m1}:${s1 < 10 ? '0' : ''}${s1}`;
            document.getElementById('opp-timer').innerText = `${m2}:${s2 < 10 ? '0' : ''}${s2}`;
            document.getElementById('my-timer').classList.toggle('active', currentTurn === myColor);
            document.getElementById('opp-timer').classList.toggle('active', currentTurn !== myColor);
        }

        function startLocalTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (currentTurn && localTimeLeft[currentTurn] > 0) { localTimeLeft[currentTurn]--; updateTimers(localTimeLeft); }
            }, 1000);
        }

        function renderLog(history) {
            const logDiv = document.getElementById('move-log'); logDiv.innerHTML = '';
            for (let i = 0; i < history.length; i += 2) {
                const div = document.createElement('div'); div.className = 'move-item';
                div.innerHTML = `<span class="move-num">${Math.floor(i / 2) + 1}.</span> <span>${history[i]}</span> <span style="color:#aaa">${history[i+1] || ''}</span>`;
                logDiv.appendChild(div);
            }
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        socket.on('players_update', (data) => {
            const ids = Object.keys(data);
            if (ids.length >= 2 && !isReplayMode) {
                const oppId = ids.find(id => id !== myUserId);
                if (oppId) {
                    const opp = data[oppId];
                    document.getElementById('opp-name').innerText = opp.name;
                    document.getElementById('opp-rating').innerText = opp.rating;
                    document.getElementById('my-rating').innerText = data[myUserId].rating;
                    document.getElementById('opp-avatar').style.backgroundImage = opp.photo ? `url('${opp.photo}')` : `url('https://api.dicebear.com/7.x/bottts/svg?seed=${oppId}')`;
                }
            }
        });

        socket.on('game_state', (data) => {
            if (isReplayMode) return;
            lastServerFen = data.fen; game.load(data.fen); board.position(data.fen); currentTurn = game.turn();
            if (data.time_left) updateTimers(data.time_left);
            if (data.history) renderLog(data.history);
            
            let statusMsg = data.status === 'waiting' ? "Ожидание..." : (currentTurn === myColor ? "Ваш ход" : "Ход соперника");
            if (game.in_check()) { statusMsg += " (ШАХ!)"; document.getElementById('status-text').style.color = "#ff4444"; } else { document.getElementById('status-text').style.color = "#bbb"; }
            document.getElementById('status-text').innerText = statusMsg;
            if (currentRoom && currentTurn !== myColor && !game.game_over()) $premoveBtn.style.display = 'block'; else $premoveBtn.style.display = 'none';
            if (data.status === 'playing') startLocalTimer();
            if (premoveFrom && premoveTo && currentTurn === myColor) {
                var move = game.move({ from: premoveFrom, to: premoveTo, promotion: 'q' });
                if (move) { board.position(game.fen()); socket.emit('move', { room: currentRoom, move: { from: premoveFrom, to: premoveTo } }); } 
                else { tg.showAlert("Ваш премув был отменен."); }
            }
            premoveFrom = null; premoveTo = null; isPremoveMode = false;
            $premoveBtn.innerText = "Включить премув"; $premoveBtn.style.background = ""; $cancelPremoveBtn.style.display = 'none';
        });

        socket.on('game_over', (data) => {
            if (isReplayMode) return;
            clearInterval(timerInterval);
            if (data.result === 'checkmate' && !game.in_checkmate()) return;
            let text = data.result === 'timeout' ? "Время вышло!" : (data.result === 'draw' ? "Ничья" : (data.result === 'disconnect' ? "Соперник сдался (выход)!" : "Победа " + (data.winner === 'white' ? 'Белых' : 'Черных')));
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal').style.display = 'flex';
        });

        socket.on('invalid_move', (data) => {
            tg.showAlert('Сервер отклонил ход: ' + data.msg);
            if (lastServerFen) { game.load(lastServerFen); board.position(lastServerFen); }
            selectedSquare = null; removeHighlights();
        });

        $('#board').on('click', '.square-55d63', function(e) {
            if (isReplayMode || game.game_over()) return; 
            const square = $(e.target).attr('data-square');
            if (isPremoveMode) {
                if (currentTurn === myColor) { isPremoveMode = false; $premoveBtn.innerText = "Включить премув"; $premoveBtn.style.background = ""; } 
                else {
                    if (!premoveFrom) { var piece = game.get(square); if (piece && piece.color === myColor) { premoveFrom = square; removeHighlights(); $('#board .square-' + square).addClass('highlight-premove-selected'); } } 
                    else {
                        if (premoveFrom === square) { premoveFrom = null; removeHighlights(); } 
                        else { premoveTo = square; $('#board .square-' + premoveTo).addClass('highlight-premove-capture'); isPremoveMode = false; $premoveBtn.innerText = "Включить премув"; $premoveBtn.style.background = ""; $cancelPremoveBtn.style.display = 'block'; }
                    }
                    return; 
                }
            }
            if (currentTurn !== myColor) { tg.showAlert("Сейчас ход соперника."); return; }
            if (!selectedSquare) {
                var piece = game.get(square);
                if (piece && piece.color === game.turn()) { 
                    selectedSquare = square; removeHighlights(); $('#board .square-' + square).addClass('highlight-selected');
                    var moves = game.moves({ square: square, verbose: true });
                    for (var i = 0; i < moves.length; i++) { const target = moves[i].to; if (game.get(target)) $('#board .square-' + target).addClass('highlight-capture'); else $('#board .square-' + target).addClass('highlight-dot'); }
                }
            } else {
                if (selectedSquare === square) { selectedSquare = null; removeHighlights(); return; }
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) { board.position(game.fen()); socket.emit('move', { room: currentRoom, move: { from: selectedSquare, to: square } }); selectedSquare = null; removeHighlights(); } 
                else {
                    var piece = game.get(square);
                    if (piece && piece.color === game.turn()) { 
                        selectedSquare = square; removeHighlights(); $('#board .square-' + square).addClass('highlight-selected');
                        var moves = game.moves({ square: square, verbose: true });
                        for (var i = 0; i < moves.length; i++) { const target = moves[i].to; if (game.get(target)) $('#board .square-' + target).addClass('highlight-capture'); else $('#board .square-' + target).addClass('highlight-dot'); }
                    } else { selectedSquare = null; removeHighlights(); }
                }
            }
        });
    </script>
</body>
</html>
